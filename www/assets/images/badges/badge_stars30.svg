<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="badgeGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffd233" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd233" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#badgeGlow4)"/>

  <!-- Starburst Outer Medal -->
  <circle cx="60" cy="60" r="42" fill="url(#goldTrophy)" stroke="#713f12" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="34" fill="#1e1b4b" stroke="#fef08a" stroke-width="2"/>

  <!-- Giant Trophy Star -->
  <polygon points="60,32 67,50 86,50 71,62 76,80 60,68 44,80 49,62 34,50 53,50" fill="url(#goldTrophy)" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Number 30 / Center Accent -->
  <circle cx="60" cy="60" r="10" fill="#0f172a"/>
  <text x="60" y="64" font-family="'Fredoka', sans-serif" font-size="11" font-weight="700" fill="#fde047" text-anchor="middle">30★</text>

  <!-- Sparkles -->
  <circle cx="38" cy="38" r="2.5" fill="#ffffff"/>
  <circle cx="82" cy="38" r="2.5" fill="#ffffff"/>
</svg>
