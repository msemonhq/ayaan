<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="badgeGlow5" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#00f5a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mintPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="45%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#badgeGlow5)"/>

  <!-- Medal Body -->
  <circle cx="60" cy="60" r="42" fill="url(#mintPlate)" stroke="#042f2e" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="34" fill="#022c22" stroke="#5eead4" stroke-width="2"/>

  <!-- Star Rush Popping Stars -->
  <circle cx="44" cy="50" r="10" fill="#ffd233" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="72" cy="46" r="12" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="58" cy="74" r="14" fill="#ff2a85" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Pop Sparkle Rays -->
  <line x1="58" y1="46" x2="58" y2="40" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="68" x2="84" y2="72" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="68" x2="32" y2="72" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
