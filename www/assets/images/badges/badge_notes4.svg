<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="badgeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#bd7aff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#bd7aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purplePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd233"/>
      <stop offset="100%" stop-color="#ff763b"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#badgeGlow2)"/>

  <!-- Outer Octagon / Starburst Medal Disc -->
  <circle cx="60" cy="60" r="42" fill="url(#purplePlate)" stroke="#3b0764" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="34" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>

  <!-- Stardust Ring -->
  <ellipse cx="60" cy="60" rx="30" ry="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" transform="rotate(-25 60 60)"/>

  <!-- Musical Eighth Notes Pair -->
  <!-- Note Heads -->
  <ellipse cx="48" cy="74" rx="7" ry="5.5" fill="url(#noteGrad)" transform="rotate(-20 48 74)"/>
  <ellipse cx="72" cy="68" rx="7" ry="5.5" fill="url(#noteGrad)" transform="rotate(-20 72 68)"/>

  <!-- Note Stems -->
  <rect x="52" y="44" width="4" height="30" fill="url(#noteGrad)"/>
  <rect x="76" y="38" width="4" height="30" fill="url(#noteGrad)"/>

  <!-- Connecting Beam -->
  <polygon points="52,44 80,38 80,44 52,50" fill="url(#noteGrad)"/>

  <!-- Sparkles -->
  <circle cx="36" cy="48" r="2.5" fill="#ffffff"/>
  <circle cx="84" cy="76" r="2" fill="#ffd233"/>
</svg>
