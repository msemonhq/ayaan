<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="cometGlow" cx="65%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ff763b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff763b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cometTail" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ff763b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ffd233" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd233" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cometHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ff763b"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="75" cy="45" r="40" fill="url(#cometGlow)"/>

  <!-- Dynamic Tail Ribbons -->
  <path d="M 85,25 C 60,35 30,65 10,110 C 25,85 50,60 70,55 Z" fill="url(#cometTail)"/>
  <path d="M 75,15 C 50,30 20,60 5,95 C 18,72 40,50 65,40 Z" fill="url(#cometTail)" opacity="0.7"/>

  <!-- Star Sparks in Tail -->
  <circle cx="28" cy="88" r="2.5" fill="#ffd233"/>
  <circle cx="45" cy="65" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="20" cy="70" r="1.8" fill="#ff763b"/>

  <!-- Comet Head Sphere -->
  <circle cx="76" cy="44" r="30" fill="url(#cometHead)" stroke="#ff4d00" stroke-width="2"/>

  <!-- Speed/Fire Flare Details -->
  <path d="M 52 35 Q 65 40 68 56" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Kawaii Determined/Joyful Eyes -->
  <ellipse cx="72" cy="42" rx="4" ry="5.5" fill="#2d0a00"/>
  <circle cx="70.5" cy="40" r="1.8" fill="#ffffff"/>
  
  <ellipse cx="88" cy="40" rx="4" ry="5.5" fill="#2d0a00"/>
  <circle cx="86.5" cy="38" r="1.8" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <circle cx="66" cy="49" r="3" fill="#ff3366" opacity="0.75"/>
  <circle cx="94" cy="46" r="3" fill="#ff3366" opacity="0.75"/>

  <!-- Big Grin -->
  <path d="M 78 48 Q 82 55 87 47" fill="none" stroke="#2d0a00" stroke-width="2" stroke-linecap="round"/>
</svg>
