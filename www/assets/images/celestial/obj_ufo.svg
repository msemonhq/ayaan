<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="ufoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saucerHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#a5f3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#ufoGlow)"/>

  <!-- Tractor Beam Glow at Bottom -->
  <path d="M 45,78 L 30,110 L 90,110 L 75,78 Z" fill="#38bdf8" opacity="0.18"/>

  <!-- Antenna with Glowing Orb -->
  <line x1="60" y1="34" x2="60" y2="18" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="16" r="6" fill="#ffd233" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Cockpit Glass Dome -->
  <path d="M 38,56 C 38,34 82,34 82,56 Z" fill="url(#domeGrad)" stroke="#0891b2" stroke-width="2"/>
  
  <!-- Friendly Creature inside Dome -->
  <circle cx="60" cy="46" r="8" fill="#a855f7"/>
  <circle cx="58" cy="45" r="1.8" fill="#ffffff"/>
  <circle cx="62" cy="45" r="1.8" fill="#ffffff"/>
  <path d="M 58 48 Q 60 50 62 48" fill="none" stroke="#2e1065" stroke-width="1" stroke-linecap="round"/>

  <!-- Dome Glare -->
  <path d="M 44,48 C 44,38 52,38 58,38" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Saucer Main Disk/Hull -->
  <ellipse cx="60" cy="62" rx="48" ry="16" fill="url(#saucerHull)" stroke="#0369a1" stroke-width="2.5"/>
  <ellipse cx="60" cy="67" rx="40" ry="11" fill="#075985"/>

  <!-- Perimeter Pulsing Lights -->
  <circle cx="22" cy="63" r="3.5" fill="#ffd233" stroke="#ffffff" stroke-width="1"/>
  <circle cx="37" cy="67" r="3.5" fill="#ff2a85" stroke="#ffffff" stroke-width="1"/>
  <circle cx="60" cy="69" r="4.2" fill="#00f5a0" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="83" cy="67" r="3.5" fill="#ff763b" stroke="#ffffff" stroke-width="1"/>
  <circle cx="98" cy="63" r="3.5" fill="#ffd233" stroke="#ffffff" stroke-width="1"/>
</svg>
