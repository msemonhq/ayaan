<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#bd7aff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bd7aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c4ff"/>
      <stop offset="50%" stop-color="#bd7aff"/>
      <stop offset="100%" stop-color="#8035d8"/>
    </linearGradient>
    <linearGradient id="craterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e2bbd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4e1a8a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#moonGlow)"/>

  <!-- Crescent Moon Body -->
  <path d="M 68,14 
           A 46,46 0 1,1 68,106 
           A 37,37 0 0,0 68,14 Z" 
        fill="url(#moonGrad)" 
        stroke="#d5a8ff" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Craters -->
  <circle cx="48" cy="34" r="6" fill="url(#craterGrad)"/>
  <circle cx="36" cy="62" r="8" fill="url(#craterGrad)"/>
  <circle cx="50" cy="88" r="5" fill="url(#craterGrad)"/>

  <!-- Cute Eyes (Sleepy / Peaceful Joy) -->
  <path d="M 44 48 Q 50 43 56 48" fill="none" stroke="#2a0845" stroke-width="2.6" stroke-linecap="round"/>
  
  <!-- Rosy Cheek -->
  <ellipse cx="52" cy="56" rx="4" ry="2.5" fill="#ff76b8" opacity="0.8"/>

  <!-- Sweet Smiling Mouth -->
  <path d="M 58 52 Q 62 58 66 52" fill="none" stroke="#2a0845" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Sparkle Stars near tip -->
  <path d="M 85 24 Q 85 30 91 30 Q 85 30 85 36 Q 85 30 79 30 Q 85 30 85 24 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="82" cy="74" r="2.5" fill="#ffd233"/>
  <circle cx="94" cy="58" r="1.8" fill="#ffffff" opacity="0.8"/>
</svg>
