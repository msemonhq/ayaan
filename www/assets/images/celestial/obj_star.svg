<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe853" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff875"/>
      <stop offset="60%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="eyeShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2200"/>
      <stop offset="100%" stop-color="#140a00"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#starGlow)"/>

  <!-- Star Shape with Rounded Vertices -->
  <path d="M 60,10 
           C 63,28 73,38 91,41 
           C 76,52 74,68 81,87 
           C 65,78 52,83 39,87 
           C 46,68 44,52 29,41 
           C 47,38 57,28 60,10 Z" 
        fill="url(#starBody)" 
        stroke="#ffa200" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <!-- Kawaii Big Sparkle Eyes -->
  <!-- Left Eye -->
  <ellipse cx="50" cy="52" rx="4.8" ry="6.2" fill="url(#eyeShine)"/>
  <circle cx="48.5" cy="50" r="2.2" fill="#ffffff"/>
  <circle cx="51.8" cy="54.2" r="1.1" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="70" cy="52" rx="4.8" ry="6.2" fill="url(#eyeShine)"/>
  <circle cx="68.5" cy="50" r="2.2" fill="#ffffff"/>
  <circle cx="71.8" cy="54.2" r="1.1" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="43" cy="60" rx="3.5" ry="2.2" fill="#ff6b8b" opacity="0.75"/>
  <ellipse cx="77" cy="60" rx="3.5" ry="2.2" fill="#ff6b8b" opacity="0.75"/>

  <!-- Cheerful Smile -->
  <path d="M 54 59 Q 60 67 66 59" fill="none" stroke="#602800" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Top Crown Sparkle -->
  <circle cx="34" cy="24" r="2" fill="#ffffff" opacity="0.9"/>
  <path d="M 88 28 Q 88 34 94 34 Q 88 34 88 40 Q 88 34 82 34 Q 88 34 88 28 Z" fill="#ffffff" opacity="0.85"/>
</svg>
