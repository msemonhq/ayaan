<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2d1f69"/>
      <stop offset="60%" stop-color="#110c2c"/>
      <stop offset="100%" stop-color="#070414"/>
    </radialGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Space Rounded Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Antigravity Chamber Halo -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="14 10" opacity="0.45"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>

  <!-- Floating Stardust Stars -->
  <circle cx="110" cy="130" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="390" cy="110" r="5" fill="#fef08a" opacity="0.9"/>
  <circle cx="410" cy="380" r="3.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="120" cy="390" r="4.5" fill="#67e8f9" opacity="0.85"/>
  <circle cx="256" cy="70" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- Floating Planet in Background -->
  <circle cx="370" cy="160" r="32" fill="#0284c7" filter="url(#glow)"/>
  <ellipse cx="370" cy="160" rx="46" ry="12" fill="none" stroke="#67e8f9" stroke-width="4" transform="rotate(-25 370 160)"/>

  <!-- Golden Memory Star -->
  <polygon points="150,160 162,185 190,188 170,208 175,235 150,222 125,235 130,208 110,188 138,185" fill="#ffd233" filter="url(#glow)"/>

  <!-- Central Antigravity Hero Rocket Ship -->
  <g transform="translate(256,270) rotate(-45) translate(-75,-110)" filter="url(#glow)">
    <!-- Exhaust Flame -->
    <polygon points="60,190 75,240 90,190" fill="#f59e0b"/>
    <polygon points="65,190 75,225 85,190" fill="#fef08a"/>

    <!-- Fins -->
    <path d="M40,150 L20,185 L55,175 Z" fill="#e11d48"/>
    <path d="M110,150 L130,185 L95,175 Z" fill="#e11d48"/>

    <!-- Rocket Body -->
    <path d="M75,20 C45,60 45,140 45,180 L105,180 C105,140 105,60 75,20 Z" fill="url(#rocketGrad)"/>

    <!-- Porthole Window -->
    <circle cx="75" cy="95" r="20" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <circle cx="75" cy="95" r="14" fill="#38bdf8"/>
    <circle cx="71" cy="91" r="5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Glowing Emblem Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
</svg>
